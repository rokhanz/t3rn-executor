# === UTILITY FUNCTIONS ===

# Get Alchemy RPC URL for network
get_alchemy_rpc_url() {
    local network="$1"
    local api_key="$2"
    
    if [[ -z "$api_key" ]]; then
        echo ""
        return 1
    fi
    
    local template="${ALCHEMY_RPC_TEMPLATES[$network]:-}"
    if [[ -n "$template" ]]; then
        echo "${template//\{API_KEY\}/$api_key}"
    else
        echo ""
        return 1
    fi
}

# Get fallback RPC URL for network
get_fallback_rpc_url() {
    local network="$1"
    echo "${FALLBACK_RPC_ENDPOINTS[$network]:-}"
}

# Get WebSocket RPC URL for network
get_websocket_rpc_url() {
    local network="$1"
    local api_key="$2"
    
    local template="${WEBSOCKET_RPC_ENDPOINTS[$network]:-}"
    if [[ -n "$template" && "$template" =~ \{API_KEY\} ]]; then
        if [[ -n "$api_key" ]]; then
            echo "${template//\{API_KEY\}/$api_key}"
        else
            echo ""
            return 1
        fi
    else
        echo "$template"
    fi
}

# Get best available RPC URL for network
get_best_rpc_url() {
    local network="$1"
    local api_key="${2:-}"
    
    # Try Alchemy first if supported and API key available
    if is_alchemy_supported "$network" && [[ -n "$api_key" ]]; then
        local alchemy_url=$(get_alchemy_rpc_url "$network" "$api_key")
        if [[ -n "$alchemy_url" ]]; then
            echo "$alchemy_url"
            return 0
        fi
    fi
    
    # Fallback to public RPC
    local fallback_url=$(get_fallback_rpc_url "$network")
    if [[ -n "$fallback_url" ]]; then
        echo "$fallback_url"
        return 0
    fi
    
    return 1
}

# Get network balance threshold
get_network_balance_threshold() {
    local network="$1"
    echo "${DEFAULT_BALANCE_THRESHOLDS[$network]:-0.5}"
}

# Get network gas price multiplier
get_network_gas_multiplier() {
    local network="$1"
    echo "${GAS_PRICE_MULTIPLIERS[$network]:-1.5}"
}

# Get network MEV risk level
get_network_mev_risk() {
    local network="$1"
    echo "${MEV_RISK_LEVELS[$network]:-medium}"
}

# Get network block confirmations
get_network_confirmations() {
    local network="$1"
    echo "${BLOCK_CONFIRMATIONS[$network]:-3}"
}

# Get network priority
get_network_priority() {
    local network="$1"
    echo "${NETWORK_PRIORITIES[$network]:-5}"
}

# Get network explorer URL
get_network_explorer() {
    local network="$1"
    echo "${EXPLORER_URLS[$network]:-}"
}

# Get transaction URL in explorer
get_transaction_url() {
    local network="$1"
    local tx_hash="$2"
    
    local explorer_url=$(get_network_explorer "$network")
    if [[ -n "$explorer_url" ]]; then
        echo "$explorer_url/tx/$tx_hash"
    else
        echo ""
    fi
}

# Get address URL in explorer
get_address_url() {
    local network="$1"
    local address="$2"
    
    local explorer_url=$(get_network_explorer "$network")
    if [[ -n "$explorer_url" ]]; then
        echo "$explorer_url/address/$address"
    else
        echo ""
    fi
}

# Sort networks by priority
get_networks_by_priority() {
    local networks=("$@")
    local sorted_networks=()
    
    # Create array of network:priority pairs
    local network_priorities=()
    for network in "${networks[@]}"; do
        local priority=$(get_network_priority "$network")
        network_priorities+=("$priority:$network")
    done
    
    # Sort by priority (descending)
    IFS=$'\n' sorted_priorities=($(sort -rn <<< "${network_priorities[*]}"))
    
    # Extract network names
    for entry in "${sorted_priorities[@]}"; do
        sorted_networks+=("${entry#*:}")
    done
    
    echo "${sorted_networks[@]}"
}

# Get networks by MEV risk level
get_networks_by_mev_risk() {
    local risk_level="$1"
    local matching_networks=()
    
    for network in "${ALL_NETWORKS[@]}"; do
        if [[ "$(get_network_mev_risk "$network")" == "$risk_level" ]]; then
            matching_networks+=("$network")
        fi
    done
    
    echo "${matching_networks[@]}"
}

# Generate network configuration for environment
generate_network_env_config() {
    local api_key="${1:-}"
    
    echo "# Generated Network Configuration"
    echo "# Generated on: $(date)"
    echo ""
    
    for network in "${ALL_NETWORKS[@]}"; do
        local code=$(get_network_code "$network")
        local rpc_var="RPC_${code^^}"
        local threshold_var="BALANCE_THRESHOLD_${code^^}"
        
        # Get best RPC URL
        local rpc_url=$(get_best_rpc_url "$network" "$api_key")
        local threshold=$(get_network_balance_threshold "$network")
        
        echo "# $network ($(get_network_display_name "$network"))"
        echo "$rpc_var=\"$rpc_url\""
        echo "$threshold_var=\"$threshold\""
        echo ""
    done
}

# Validate network configuration
validate_network_mappings() {
    local errors=0
    
    echo "Validating network mappings..."
    
    # Check that all networks have required mappings
    for network in "${ALL_NETWORKS[@]}"; do
        local emoji=$(get_network_emoji "$network")
        local chain_id=$(get_network_chain_id "$network")
        local threshold=$(get_network_balance_threshold "$network")
        local multiplier=$(get_network_gas_multiplier "$network")
        local risk=$(get_network_mev_risk "$network")
        local confirmations=$(get_network_confirmations "$network")
        local priority=$(get_network_priority "$network")
        
        if [[ -z "$emoji" || "$emoji" == "🔗" ]]; then
            echo "  ❌ Missing emoji for $network"
            ((errors++))
        fi
        
        if [[ -z "$chain_id" || "$chain_id" == "0" ]]; then
            echo "  ❌ Missing chain ID for $network"
            ((errors++))
        fi
        
        if [[ -z "$threshold" ]]; then
            echo "  ❌ Missing balance threshold for $network"
            ((errors++))
        fi
        
        if [[ -z "$multiplier" ]]; then
            echo "  ❌ Missing gas multiplier for $network"
            ((errors++))
        fi
        
        if [[ -z "$risk" ]]; then
            echo "  ❌ Missing MEV risk level for $network"
            ((errors++))
        fi
        
        if [[ -z "$confirmations" ]]; then
            echo "  ❌ Missing block confirmations for $network"
            ((errors++))
        fi
        
        if [[ -z "$priority" ]]; then
            echo "  ❌ Missing priority for $network"
            ((errors++))
        fi
    done
    
    if [[ $errors -eq 0 ]]; then
        echo "✅ All network mappings are valid"
        return 0
    else
        echo "❌ Found $errors validation errors"
        return 1
    fi
}

# Print comprehensive network configuration table
print_network_configuration_table() {
    echo "T3RN Network Configuration Table"
    echo "==============================="
    printf "%-20s %-6s %-4s %-10s %-8s %-6s %-8s %-4s %-8s\n" \
        "Network" "Code" "Emoji" "Chain ID" "Alchemy" "Thresh" "GasMult" "Risk" "Priority"
    echo "----------------------------------------------------------------------------------------"
    
    for network in "${ALL_NETWORKS[@]}"; do
        local code=$(get_network_code "$network")
        local emoji=$(get_network_emoji "$network")
        local chain_id=$(get_network_chain_id "$network")
        local alchemy=$(is_alchemy_supported "$network" && echo "Yes" || echo "No")
        local threshold=$(get_network_balance_threshold "$network")
        local multiplier=$(get_network_gas_multiplier "$network")
        local risk=$(get_network_mev_risk "$network")
        local priority=$(get_network_priority "$network")
        
        printf "%-20s %-6s %-4s %-10s %-8s %-6s %-8s %-4s %-8s\n" \
            "$network" "$code" "$emoji" "$chain_id" "$alchemy" \
            "$threshold" "$multiplier" "$risk" "$priority"
    done
    
    echo ""
    echo "Summary:"
    echo "  Total Networks: ${#ALL_NETWORKS[@]}"
    echo "  Alchemy Supported: ${#ALCHEMY_SUPPORTED_NETWORKS[@]}"
    echo "  High MEV Risk: $(get_networks_by_mev_risk "high" | wc -w)"
    echo "  Medium MEV Risk: $(get_networks_by_mev_risk "medium" | wc -w)"
    echo "  Low MEV Risk: $(get_networks_by_mev_risk "low" | wc -w)"
}

