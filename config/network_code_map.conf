)

declare -A NETWORK_TO_CODE_MAP=(
    ["arbitrum-sepolia"]="arbt"
    ["base-sepolia"]="bast"
    ["blast-sepolia"]="blst"
    ["optimism-sepolia"]="opst"
    ["unichain-sepolia"]="unit"
    ["monad-testnet"]="mont"
    ["sei-testnet"]="seit"
    ["abstract-testnet"]="abst"
    ["lisk-sepolia"]="lisk"
    ["berachain-bepolia"]="bera"
    ["bnb-testnet"]="bnb"
    ["l2rn"]="l2rn"
)

# === NETWORK LISTS ===
# Arrays of all networks for iteration

ALL_NETWORKS=(
    "arbitrum-sepolia"
    "base-sepolia"
    "blast-sepolia"
    "optimism-sepolia"
    "unichain-sepolia"
    "monad-testnet"
    "sei-testnet"
    "abstract-testnet"
    "lisk-sepolia"
    "berachain-bepolia"
    "bnb-testnet"
    "l2rn"
)

ALL_NETWORK_CODES=(
    "arbt"
    "bast"
    "blst"
    "opst"
    "unit"
    "mont"
    "seit"
    "abst"
    "lisk"
    "bera"
    "bnb"
    "l2rn"
)

ALCHEMY_SUPPORTED_NETWORKS=(
    "arbitrum-sepolia"
    "base-sepolia"
    "blast-sepolia"
    "optimism-sepolia"
    "unichain-sepolia"
    "monad-testnet"
    "sei-testnet"
    "abstract-testnet"
    "berachain-bepolia"
    "bnb-testnet"
)

PUBLIC_RPC_ONLY_NETWORKS=(
    "lisk-sepolia"
    "l2rn"
)

# === UTILITY FUNCTIONS ===

# Get network code from full name
get_network_code() {
    local network_name="$1"
    echo "${NETWORK_TO_CODE_MAP[$network_name]:-unknown}"
}

# Get full network name from code
get_network_name() {
    local network_code="$1"
    echo "${CODE_TO_NETWORK_MAP[$network_code]:-unknown}"
}

# Get network display name
get_network_display_name() {
    local network="$1"
    local var_name="NETWORK_DISPLAY_$(echo "$network" | tr '[:lower:]-' '[:upper:]_')"
    echo "${!var_name:-$network}"
}

# Get network emoji
get_network_emoji() {
    local network="$1"
    local var_name="NETWORK_EMOJI_$(echo "$network" | tr '[:lower:]-' '[:upper:]_')"
    echo "${!var_name:-🔗}"
}

# Get network chain ID
get_network_chain_id() {
    local network="$1"
    local var_name="NETWORK_CHAIN_ID_$(echo "$network" | tr '[:lower:]-' '[:upper:]_')"
    echo "${!var_name:-0}"
}

# Check if network supports Alchemy
is_alchemy_supported() {
    local network="$1"
    local var_name="NETWORK_ALCHEMY_SUPPORTED_$(echo "$network" | tr '[:lower:]-' '[:upper:]_')"
    local supported="${!var_name:-false}"
    [[ "$supported" == "true" ]]
}

# Get RPC variable name for network
get_rpc_var_name() {
    local network="$1"
    local code=$(get_network_code "$network")
    echo "RPC_${code^^}"
}

# Get balance threshold variable name for network
get_balance_threshold_var_name() {
    local network="$1"
    local code=$(get_network_code "$network")
    echo "BALANCE_THRESHOLD_${code^^}"
}

# Validate network name
is_valid_network() {
    local network="$1"
    for valid_network in "${ALL_NETWORKS[@]}"; do
        if [[ "$network" == "$valid_network" ]]; then
            return 0
        fi
    done
    return 1
}

# Validate network code
is_valid_network_code() {
    local code="$1"
    for valid_code in "${ALL_NETWORK_CODES[@]}"; do
        if [[ "$code" == "$valid_code" ]]; then
            return 0
        fi
    done
    return 1
}

# Get all enabled networks from environment
get_enabled_networks() {
    local enabled_networks="${ENABLED_NETWORKS:-}"
    if [[ -n "$enabled_networks" ]]; then
        echo "$enabled_networks" | tr ',' ' '
    else
        echo "${ALL_NETWORKS[@]}"
    fi
}

# Get network information as JSON
get_network_info_json() {
    local network="$1"
    
    if ! is_valid_network "$network"; then
        echo "{\"error\": \"Invalid network: $network\"}"
        return 1
    fi
    
    local code=$(get_network_code "$network")
    local display_name=$(get_network_display_name "$network")
    local emoji=$(get_network_emoji "$network")
    local chain_id=$(get_network_chain_id "$network")
    local alchemy_supported=$(is_alchemy_supported "$network" && echo "true" || echo "false")
    
    cat << EOF
{
  "network": "$network",
  "code": "$code",
  "displayName": "$display_name",
  "emoji": "$emoji",
  "chainId": "$chain_id",
  "alchemySupported": $alchemy_supported,
  "rpcVar": "$(get_rpc_var_name "$network")",
  "balanceThresholdVar": "$(get_balance_threshold_var_name "$network")"
}
EOF
}

# Get all networks information as JSON
get_all_networks_info_json() {
    echo "{"
    echo "  \"networks\": ["
    
    local first=true
    for network in "${ALL_NETWORKS[@]}"; do
        if [[ "$first" == "true" ]]; then
            first=false
        else
            echo ","
        fi
        
        echo -n "    "
        get_network_info_json "$network" | sed 's/^/    /'
    done
    
    echo ""
    echo "  ],"
    echo "  \"summary\": {"
    echo "    \"totalNetworks\": ${#ALL_NETWORKS[@]},"
    echo "    \"alchemySupported\": ${#ALCHEMY_SUPPORTED_NETWORKS[@]},"
    echo "    \"publicRpcOnly\": ${#PUBLIC_RPC_ONLY_NETWORKS[@]}"
    echo "  }"
    echo "}"
}

# Print network mapping table
print_network_mapping_table() {
    echo "T3RN Network Code Mapping Table"
    echo "==============================="
    printf "%-20s %-6s %-20s %-4s %-10s %-8s\n" "Network" "Code" "Display Name" "Emoji" "Chain ID" "Alchemy"
    echo "--------------------------------------------------------------------------------"
    
    for network in "${ALL_NETWORKS[@]}"; do
        local code=$(get_network_code "$network")
        local display_name=$(get_network_display_name "$network")
        local emoji=$(get_network_emoji "$network")
        local chain_id=$(get_network_chain_id "$network")
        local alchemy=$(is_alchemy_supported "$network" && echo "Yes" || echo "No")
        
        printf "%-20s %-6s %-20s %-4s %-10s %-8s\n" \
            "$network" "$code" "$display_name" "$emoji" "$chain_id" "$alchemy"
    done
    
    echo ""
    echo "Summary:"
    echo "  Total Networks: ${#ALL_NETWORKS[@]}"
    echo "  Alchemy Supported: ${#ALCHEMY_SUPPORTED_NETWORKS[@]}"
    echo "  Public RPC Only: ${#PUBLIC_RPC_ONLY_NETWORKS[@]}"
}

# Export arrays and functions for use in other scripts
export ALL_NETWORKS
export ALL_NETWORK_CODES
export ALCHEMY_SUPPORTED_NETWORKS
export PUBLIC_RPC_ONLY_NETWORKS
export CODE_TO_NETWORK_MAP
export NETWORK_TO_CODE_MAP

export -f get_network_code
export -f get_network_name
export -f get_network_display_name
export -f get_network_emoji
export -f get_network_chain_id
export -f is_alchemy_supported
export -f get_rpc_var_name
export -f get_balance_threshold_var_name
export -f is_valid_network
export -f is_valid_network_code
export -f get_enabled_networks
export -f get_network_info_json
export -f get_all_networks_info_json
export -f print_network_mapping_table

# Print mapping table if run directly
if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    print_network_mapping_table
fi
